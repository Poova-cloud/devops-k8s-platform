apiVersion: batch/v1
kind: Job
metadata:
  name: demo-job
  namespace: devops-demo

spec:
  template:
    spec:
      containers:
        - name: demo-job
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - echo "Kubernetes Job executed successfully"; sleep 5
      restartPolicy: Never

  backoffLimit: 3
