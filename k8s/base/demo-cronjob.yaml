apiVersion: batch/v1
kind: CronJob
metadata:
  name: demo-cronjob
  namespace: devops-demo

spec:
  schedule: "*/2 * * * *"

  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: demo-cronjob
              image: busybox:1.36
              command:
                - /bin/sh
                - -c
                - echo "CronJob executed at $(date)"
          restartPolicy: Never
