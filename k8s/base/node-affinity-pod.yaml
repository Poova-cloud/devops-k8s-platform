apiVersion: v1
kind: Pod
metadata:
  name: node-affinity-demo
  namespace: devops-demo

spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: workload
                operator: In
                values:
                  - application

  containers:
    - name: nginx
      image: nginx:1.28
