apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
  namespace: devops-demo
spec:
  replicas: 4

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: nginx-demo

  template:
    metadata:
      labels:
        app: nginx-demo

    spec:
      containers:
        - name: nginx
          image: nginx:this-version-does-not-exist
          ports:
            - containerPort: 80
