apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
  namespace: devops-demo

spec:
  replicas: 4

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: nginx-demo

  template:
    metadata:
      labels:
        app: nginx-demo

    spec:
      containers:
        - name: nginx
          image: nginx:1.28
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          env:
            - name: APP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: nginx-secret
                  key: APP_USERNAME

            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nginx-secret
                  key: APP_PASSWORD

          volumeMounts:
            - name: nginx-html
              mountPath: /usr/share/nginx/html

      volumes:
        - name: nginx-html
          configMap:
            name: nginx-config
